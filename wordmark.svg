<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 84" width="312" height="84">
    <style>
        .text {
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            fill: #222;
            white-space: pre;
            clip-path: url(#wipe-clip);
        }
        @media (prefers-color-scheme: dark) {
            .text { fill: #eee; }
        }
        @keyframes wipe {
            from { width: 0; }
            to { width: 100%; }
        }
        .wipe-rect {
            animation: wipe 2s ease-in-out forwards;
        }
    </style>
    <defs>
        <clipPath id="wipe-clip">
            <rect x="0" y="0" width="0" height="100%" class="wipe-rect" />
        </clipPath>
    </defs>
    <rect width="100%" height="100%" fill="transparent"/>
    <g class="text">
